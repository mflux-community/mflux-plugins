[build-system]
# The backend this package is built and tested with: uv 0.11.2 (CI pins it) builds with its own uv_build 0.11.2.
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
default-excludes = true
# mflux PR #776 namespace contract: this distribution ships only mflux/extras/teacache/.
# Never ship src/mflux/__init__.py (mflux core owns it) or src/mflux/extras/__init__.py
# (mflux.extras must stay an implicit namespace package that every extras package shares).
# The dotted module name already marks a namespace package, so no `namespace = true`.
module-name = "mflux.extras.teacache"

[project]
name = "mflux-teacache"
version = "0.2.0"
description = "TeaCache step skipping for mflux's command line, powered by mlx-teacache."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Denis Ineshin", email = "denis.ineshin@gmail.com" }]
maintainers = [{ name = "Denis Ineshin", email = "denis.ineshin@gmail.com" }]
requires-python = ">=3.11"
keywords = ["mflux", "mlx", "teacache", "apple-silicon", "diffusion", "z-image"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # The mflux upper bound comes from mlx-teacache's [mflux] extra (below 0.26 in 0.14.0). This package adds no
    # mflux upper bound. 0.14.0 records mflux up to 0.23 as checked, so on mflux 0.24 it warns and still applies.
    "mlx-teacache[mflux]>=0.14.0",
    # A floor only: 0.24 is the first mflux that imports with pillow 13 (mflux PR 890); every earlier release
    # imports PIL._typing, which pillow 13 removed.
    "mflux>=0.24",
]

[project.urls]
Homepage = "https://github.com/mflux-community/mflux-plugins/tree/main/teacache"
Repository = "https://github.com/mflux-community/mflux-plugins"
Issues = "https://github.com/mflux-community/mflux-plugins/issues"
Documentation = "https://github.com/mflux-community/mflux-plugins/tree/main/teacache#readme"

[project.scripts]
mflux-generate-z-image-teacache = "mflux.extras.teacache.z_image:main"
mflux-generate-qwen-teacache = "mflux.extras.teacache.qwen_image:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    # Pinned exactly, matching the ruff in .github/workflows/lint.yml (scripts/check_plugins.py checks the two agree).
    "ruff==0.16.3",
    "ty==0.0.72",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
respect-gitignore = true

[tool.ruff.lint]
select = ["BLE", "E4", "E7", "E9", "F", "I", "ICN", "LOG", "PERF", "W"]

[tool.ruff.lint.per-file-ignores]
# conftest.py sets HF_HUB_OFFLINE / HF_HOME before importing anything that reads them.
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
known-first-party = ["mflux.extras.teacache"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.11"

[tool.ty.analysis]
# ty cannot model mflux core's pkgutil.extend_path merge: core is a regular package in
# site-packages and this distribution adds mflux/extras/teacache/ from src/, so a static
# resolver reports absolute mflux.extras.* imports as unresolved. The package uses relative
# imports internally; tests/test_namespace.py checks the real import at runtime.
allowed-unresolved-imports = ["mflux.extras.**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # A newer mflux than mlx-teacache has verified only warns for users, so it only warns here too. Reviewed for
    # mflux 0.24.0 with mlx-teacache 0.14.0 (verified up to mflux 0.23.0); tests/test_real_teacache.py asserts this
    # warning on that pair and skips on any other, so a new locked pair means reviewing this entry again.
    "default::mlx_teacache.errors.TeaCacheUntestedMfluxWarning",
]
