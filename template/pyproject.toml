[build-system]
# The backend this package is built and tested with: uv 0.11.2 (CI pins it) builds with its own uv_build 0.11.2.
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
default-excludes = true
# mflux PR #776 namespace contract: this distribution ships only mflux/extras/myplugin/.
# Never ship src/mflux/__init__.py (mflux core owns it) or src/mflux/extras/__init__.py
# (mflux.extras must stay an implicit namespace package that every extras package shares).
# The dotted module name already marks a namespace package, so no `namespace = true`.
module-name = "mflux.extras.myplugin"

[project]
name = "mflux-myplugin"
version = "0.0.0"
description = "mflux-myplugin: <one sentence about your plugin>. This is the template; never publish it."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "the mflux-myplugin maintainers" }]
maintainers = [{ name = "the mflux-myplugin maintainers" }]
requires-python = ">=3.10"
keywords = ["mflux", "mlx", "apple-silicon", "diffusion", "z-image"]
classifiers = [
    # PyPI rejects any upload that carries this classifier. Delete it when you rename the template.
    "Private :: Do Not Upload",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    # A floor only: the first mflux whose command steps this plugin calls. Never an upper bound.
    "mflux>=0.22",
    # Add the library your plugin wraps here, from PyPI, for example "<library>>=X.Y".
]

[project.urls]
Homepage = "https://github.com/mflux-community/mflux-plugins/tree/main/template"
Repository = "https://github.com/mflux-community/mflux-plugins"
Issues = "https://github.com/mflux-community/mflux-plugins/issues"
Documentation = "https://github.com/mflux-community/mflux-plugins/tree/main/template#readme"

[project.scripts]
mflux-generate-z-image-myplugin = "mflux.extras.myplugin.z_image:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10.0",
    # Pinned exactly: the ruff version in .github/workflows/lint.yml (scripts/check_plugins.py checks they match).
    "ruff==0.16.3",
    "ty==0.0.72",
]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"
respect-gitignore = true

[tool.ruff.lint]
select = ["BLE", "E4", "E7", "E9", "F", "I", "ICN", "LOG", "PERF", "W"]

[tool.ruff.lint.per-file-ignores]
# conftest.py sets HF_HUB_OFFLINE / HF_HOME before importing anything that reads them.
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
case-sensitive = false
combine-as-imports = true
known-first-party = ["mflux.extras.myplugin"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.10"

[tool.ty.analysis]
# ty cannot model mflux core's pkgutil.extend_path merge: core is a regular package in
# site-packages and this distribution adds mflux/extras/myplugin/ from src/, so a static
# resolver reports absolute mflux.extras.* imports as unresolved. The package uses relative
# imports internally; tests/test_namespace.py checks the real import at runtime.
allowed-unresolved-imports = ["mflux.extras.**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
